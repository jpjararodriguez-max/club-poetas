<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - El Club de los Poetas del Fútbol</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
<a href="elegir-perfil.html" class="back-arrow">&lt;</a>

<header class="login-header">
</header>

<div class="registro-container">

    <h1 class="login-title" id="tituloRegistro">Registro de Usuario</h1>

    <p id="tipoUsuario" class="subtitle"></p>

    <!-- Formulario optimizado con control por JS -->
    <form id="registroForm" class="registro-form" autocomplete="off" novalidate>

        <!-- INPUT OCULTO PARA ENVIAR EL PERFIL AL BACKEND -->
        <input type="hidden" name="perfil" id="perfil">

        <label for="nombreCompleto">Nombre y Apellido ó crea tu nombre en esta historia</label>
        <input 
            type="text"
            id="nombreCompleto"
            name="nombreCompleto"
            placeholder="Ej: Juan Pérez"
            autocomplete="off"
            required
        >

        <label for="jugador">Jugador favorito de la historia</label>
        <select id="jugador" name="jugador" class="select-box" required>
            <option value="">-- Seleccione un jugador --</option>
        </select>

        <label for="correo">Correo electrónico</label>
        <input 
            type="email"
            id="correo"
            name="correo"
            placeholder="tucorreo@gmail.com"
            autocomplete="off"
            required
        >

        <div class="password-container">
            <input 
                type="password"
                id="password"
                name="password"
                placeholder="Crea una contraseña segura"
                autocomplete="new-password"
                required
            >

            <span id="togglePassword" class="toggle-password">
                ◎
            </span>
        </div>

        <button type="submit" class="btn btn-primary">Registrarse</button>
    </form>

</div>

<!-- Carga del script con versionamiento anti-caché -->
<script src="js/registro.js?v=FINAL"></script>

</body>
</html>
