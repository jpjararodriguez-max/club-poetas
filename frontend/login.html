<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - El Club de los Poetas del Fútbol</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
<a href="index.html" class="back-arrow">&lt;</a>
<div class="form-container">

    <header class="login-header">
        <img src="img/logo.png" class="header-logo" alt="Logo CPF">
    </header>

    <h1 class="login-title">Iniciar Sesión</h1>

    <form id="registroForm" class="form-box" autocomplete="off" novalidate>

        <label for="correo">Correo electrónico</label>
        <input 
            type="email"
            name="correo"
            id="correo"
            placeholder="tucorreo@gmail.com"
            autocomplete="off"
            required
        >

        <label for="password">Contraseña</label>
        <div class="password-container">
            <input 
                type="password"
                name="password"
                id="password"
                placeholder="Tu contraseña"
                autocomplete="current-password"
                required
            >

            <span id="togglePassword" class="toggle-password">
                ◎
            </span>
        </div>

        <button type="submit" class="btn btn-primary">
            Entrar
        </button>
        
        <a href="forgot_password.php" class="forgot-link">
            ¿Olvidaste tu contraseña?
        </a>
    </form>

</div>

<script src="js/login.js?v=FINAL"></script>

</body>
</html>
